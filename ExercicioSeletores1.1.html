```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .formulario {
            display: flex;
            gap: 10px;
        }

        #descricao {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        #adicionar {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #333;
            color: white;
        }

        #adicionar:hover {
            background: #555;
        }

        #lista-tarefas {
            list-style: none;
            padding: 0;
            margin-top: 25px;
        }

        .tarefa {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px;
            margin-bottom: 10px;
            background: #f7f7f7;
            border-radius: 8px;
        }

        .tarefa input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .descricao-tarefa {
            font-size: 16px;
        }

        .concluida .descricao-tarefa {
            text-decoration: line-through;
            opacity: 0.5;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Minha Lista de Tarefas</h1>

        <div class="formulario">
            <input type="text" id="descricao" placeholder="Digite uma nova tarefa">
            <button id="adicionar">Adicionar</button>
        </div>

        <ul id="lista-tarefas"></ul>
    </div>

    <script>
        const tarefas = [];

        const campoDescricao = document.getElementById('descricao');
        const botaoAdicionar = document.getElementById('adicionar');
        const listaTarefas = document.getElementById('lista-tarefas');

        function adicionarTarefa() {
            const descricao = campoDescricao.value.trim();

            if (descricao === '') {
                alert('Digite uma tarefa.');
                return;
            }

            const tarefa = {
                descricao: descricao,
                status: false
            };

            tarefas.push(tarefa);
            campoDescricao.value = '';

            renderizarTarefas();
        }

        function alterarStatus(indice) {
            tarefas[indice].status = !tarefas[indice].status;
            renderizarTarefas();
        }

        function renderizarTarefas() {
            listaTarefas.innerHTML = '';

            tarefas.forEach((tarefa, indice) => {
                const item = document.createElement('li');

                item.classList.add('tarefa');

                if (tarefa.status) {
                    item.classList.add('concluida');
                }

                item.innerHTML = `
                    <input type="checkbox" ${tarefa.status ? 'checked' : ''} onchange="alterarStatus(${indice})">
                    <span class="descricao-tarefa">${tarefa.descricao}</span>
                `;

                listaTarefas.appendChild(item);
            });
        }

        botaoAdicionar.addEventListener('click', adicionarTarefa);

        campoDescricao.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                adicionarTarefa();
            }
        });
    </script>

</body>
</html>
