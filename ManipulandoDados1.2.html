```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .formulario {
            display: flex;
            gap: 10px;
        }

        #descricao {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        #adicionar {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #333;
            color: white;
            font-size: 16px;
        }

        #adicionar:hover {
            background: #555;
        }

        #lista-tarefas {
            list-style: none;
            padding: 0;
            margin-top: 25px;
        }

        .tarefa {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px;
            margin-bottom: 10px;
            background: #f7f7f7;
            border-radius: 8px;
        }

        .checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .descricao-tarefa {
            flex: 1;
            font-size: 16px;
        }

        .concluida .descricao-tarefa {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .excluir {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            background: #c0392b;
            color: white;
            cursor: pointer;
        }

        .excluir:hover {
            background: #e74c3c;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Minha Lista de Tarefas</h1>

        <div class="formulario">
            <input
                type="text"
                id="descricao"
                placeholder="Digite uma nova tarefa"
            >
            <button id="adicionar">Adicionar</button>
        </div>

        <ul id="lista-tarefas"></ul>
    </div>

    <script>
        let tarefas = JSON.parse(localStorage.getItem('tarefas')) || [];

        const campoDescricao = document.getElementById('descricao');
        const botaoAdicionar = document.getElementById('adicionar');
        const listaTarefas = document.getElementById('lista-tarefas');

        function salvarTarefas() {
            localStorage.setItem('tarefas', JSON.stringify(tarefas));
        }

        function adicionarTarefa() {
            const descricao = campoDescricao.value.trim();

            if (descricao === '') {
                return;
            }

            const tarefa = {
                descricao: descricao,
                status: false
            };

            tarefas.push(tarefa);
            salvarTarefas();
            renderizarTarefas();

            campoDescricao.value = '';
            campoDescricao.focus();
        }

        function alterarStatus(indice) {
            tarefas[indice].status = !tarefas[indice].status;

            salvarTarefas();
            renderizarTarefas();
        }

        function excluirTarefa(indice) {
            tarefas.splice(indice, 1);

            salvarTarefas();
            renderizarTarefas();
        }

        function renderizarTarefas() {
            listaTarefas.innerHTML = '';

            tarefas.forEach((tarefa, indice) => {
                const item = document.createElement('li');

                item.classList.add('tarefa');

                if (tarefa.status) {
                    item.classList.add('concluida');
                }

                item.innerHTML = `
                    <input
                        type="checkbox"
                        class="checkbox"
                        ${tarefa.status ? 'checked' : ''}
                    >

                    <span class="descricao-tarefa">
                        ${tarefa.descricao}
                    </span>

                    <button class="excluir">
                        Excluir
                    </button>
                `;

                const checkbox = item.querySelector('.checkbox');
                const botaoExcluir = item.querySelector('.excluir');

                checkbox.addEventListener('change', function() {
                    alterarStatus(indice);
                });

                botaoExcluir.addEventListener('click', function() {
                    excluirTarefa(indice);
                });

                listaTarefas.appendChild(item);
            });
        }

        botaoAdicionar.addEventListener('click', adicionarTarefa);

        campoDescricao.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                adicionarTarefa();
            }
        });

        renderizarTarefas();
    </script>

</body>
</html>
